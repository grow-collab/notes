<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CORS跨域请求</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.js"></script>
</head>
<body>
<p>click</p>
<script>
    $('p').click(function(){
        $.ajax({
            url:'http://127.0.0.1:8000/user',
            methods:'GET',
            success:function(res){
                console.log(res);
                console.log(res.message)
                $('p').html('hello ' + res.message)
            }
        })
    })
</script>
</body>
</html>
